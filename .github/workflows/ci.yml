name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 4:17am PST (12:17 UTC); 5:17am during PDT
    - cron: "17 12 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22.2", "24.15.0", "26"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install fyn
        run: npm install -g fyn@3
      - name: Install root dependencies
        run: fyn install
      - name: Bootstrap test packages
        run: fyn run bootstrap
      - name: Check
        run: fyn run ci:check
